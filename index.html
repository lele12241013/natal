<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050811" />
  <title>EU TE AMO — Árvore de Natal 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <canvas id="asciiCanvas" aria-label="3D ASCII Christmas Tree Animation"></canvas>

    <div class="hover-controls" aria-label="Controles">
      <button id="btnPlayPause" type="button" title="Pausar / Continuar (Espaço)">Pause</button>
      <button id="btnRestart" type="button" title="Reiniciar (R)">Restart</button>
    </div>

    <!-- Subtle non-blocking toast when a gift opens -->
    <div class="gift-toast" id="giftToast" aria-live="polite"></div>
  </main>

  <script src="couple-points.js"></script>
  <script src="secret-finale.js"></script>
  <script src="bt21-3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
